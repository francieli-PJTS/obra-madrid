<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Obra Residencial Madrid</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Sans+Condensed:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: barra fixa com os números da obra, abas de módulo, área de trabalho em tabelas densas; gaveta lateral para a composição */
:root{
  --bg:#EEF0EE; --panel:#FBFCFB; --panel2:#F4F6F5; --ink:#1A2226; --muted:#56636A; --line:#D5DBD9;
  --accent:#1D5A86; --accent-ink:#FFFFFF; --accent-weak:#E1ECF5;
  --ok:#2C6E48; --ok-weak:#E0F0E6; --warn:#9A5408; --warn-weak:#FAEEDD; --bad:#A3271F; --bad-weak:#F9E4E2;
  --edit:#FFF7D6; --edit-line:#E8D58A; --bar:#7FA6C4; --bar-done:#2C6E48;
  --f-ui:'IBM Plex Sans',Arial,sans-serif; --f-data:'IBM Plex Sans Condensed','Arial Narrow',Arial,sans-serif; --f-mono:'IBM Plex Mono',Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#12181B; --panel:#1A2226; --panel2:#20292E; --ink:#E4EAEC; --muted:#9AA8AE; --line:#2F3B41;
  --accent:#78AEDB; --accent-ink:#0E1B26; --accent-weak:#1C3346;
  --ok:#7CC89B; --ok-weak:#18301F; --warn:#E5A65E; --warn-weak:#35270F; --bad:#F08C82; --bad-weak:#3A1D1A;
  --edit:#2B2815; --edit-line:#5E5427; --bar:#3F6A8C; --bar-done:#4F9A6E; color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#12181B; --panel:#1A2226; --panel2:#20292E; --ink:#E4EAEC; --muted:#9AA8AE; --line:#2F3B41;
  --accent:#78AEDB; --accent-ink:#0E1B26; --accent-weak:#1C3346;
  --ok:#7CC89B; --ok-weak:#18301F; --warn:#E5A65E; --warn-weak:#35270F; --bad:#F08C82; --bad-weak:#3A1D1A;
  --edit:#2B2815; --edit-line:#5E5427; --bar:#3F6A8C; --bar-done:#4F9A6E; color-scheme:dark }
*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--ink)}
body{font:14px/1.45 var(--f-ui);padding-inline:16px;padding-block:0 48px}
.wrap{max-width:1500px;margin:0 auto}
h1,h2,h3{text-wrap:balance;margin:0}
button,input,select,textarea{font:inherit;color:inherit}
.num{font-family:var(--f-data);font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}
.mono{font-family:var(--f-mono);font-size:12.5px}
.muted{color:var(--muted)}
/* topo */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);padding-block:14px 0;margin-inline:-16px;padding-inline:16px;border-bottom:1px solid var(--line)}
.id{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 16px}
.id h1{font-size:20px;font-weight:700;letter-spacing:-.01em}
.id .sub{color:var(--muted);font-size:13px}
.id .who{margin-left:auto;font-size:12px;color:var(--muted);display:flex;gap:8px;align-items:center}
.pill{display:inline-block;padding:2px 8px;border-radius:99px;font-size:12px;font-weight:600;white-space:nowrap}
.p-ok{background:var(--ok-weak);color:var(--ok)} .p-warn{background:var(--warn-weak);color:var(--warn)} .p-bad{background:var(--bad-weak);color:var(--bad)} .p-acc{background:var(--accent-weak);color:var(--accent)} .p-mut{background:var(--panel2);color:var(--muted)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:6px;overflow:hidden;margin-top:10px}
.kpi{background:var(--panel);padding:8px 12px;min-width:0}
.kpi .l{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600}
.kpi .v{font:600 19px/1.25 var(--f-data);font-variant-numeric:tabular-nums}
.kpi .s{font-size:12px;color:var(--muted)}
.tabs{display:flex;gap:2px;overflow-x:auto;margin-top:10px;scrollbar-width:thin}
.tabs button{border:0;background:none;padding:9px 14px;font-weight:600;color:var(--muted);border-bottom:3px solid transparent;cursor:pointer;white-space:nowrap}
.tabs button[aria-selected="true"]{color:var(--accent);border-bottom-color:var(--accent)}
.tabs button:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
/* corpo */
main{padding-top:18px;display:flex;flex-direction:column;gap:18px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:6px;min-width:0}
.card>header{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;padding:12px 14px;border-bottom:1px solid var(--line)}
.card>header h2{font-size:15px;font-weight:700}
.card>header .sp{flex:1}
.card .body{padding:12px 14px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,460px),1fr));gap:18px}
.scroll{overflow-x:auto;max-width:100%}
table{border-collapse:collapse;width:100%}
th,td{padding:5px 8px;border-bottom:1px solid var(--line);vertical-align:middle}
th{font:600 11.5px/1.3 var(--f-ui);text-transform:uppercase;letter-spacing:.04em;color:var(--muted);text-align:left;background:var(--panel2);position:sticky;top:0;z-index:1;white-space:nowrap}
td{font-family:var(--f-data);font-size:13.5px}
tr.grp td{background:var(--panel2);font-weight:700;font-family:var(--f-ui);text-transform:uppercase;font-size:12.5px;letter-spacing:.03em}
tr.sub td{background:var(--accent-weak);font-weight:600;font-family:var(--f-ui)}
tr.sub td:nth-child(2){padding-left:22px}
tr.tot td{font-weight:700;border-top:2px solid var(--ink)}
tr.click{cursor:pointer} tr.click:hover td{background:var(--accent-weak)}
td.desc{min-width:340px;max-width:560px}
.desc small{display:block;color:var(--muted);font-size:12px}
input.e,select.e,textarea.e{background:var(--edit);border:1px solid var(--edit-line);border-radius:3px;padding:3px 6px;width:100%;min-width:60px;font-family:var(--f-data);font-size:13.5px}
input.e.n{text-align:right;font-variant-numeric:tabular-nums}
input.e:focus,select.e:focus,textarea.e:focus{outline:2px solid var(--accent);outline-offset:0;background:var(--panel)}
input.e:disabled,select.e:disabled{background:transparent;border-color:transparent;color:inherit;opacity:1}
.btn{border:1px solid var(--line);background:var(--panel);border-radius:5px;padding:6px 12px;cursor:pointer;font-weight:600;white-space:nowrap}
.btn:hover{border-color:var(--accent)}
.btn.pri{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.sm{padding:3px 8px;font-size:12px}
.btn.del{color:var(--bad)}
.btn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.btn:disabled{opacity:.5;cursor:default}
.f{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.f label{font-size:12px;color:var(--muted);display:flex;flex-direction:column;gap:2px}
.f input,.f select{background:var(--panel);border:1px solid var(--line);border-radius:4px;padding:5px 8px}
.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;align-items:end}
.form label{font-size:12px;color:var(--muted);display:flex;flex-direction:column;gap:3px}
.form input,.form select{background:var(--panel);border:1px solid var(--line);border-radius:4px;padding:6px 8px;width:100%}
.form .wide{grid-column:1/-1}
.bar{height:8px;border-radius:4px;background:var(--panel2);overflow:hidden;min-width:60px}
.bar i{display:block;height:100%;background:var(--accent)}
.empty{padding:28px 16px;text-align:center;color:var(--muted)}
.note{font-size:12.5px;color:var(--muted)}
.alert{display:flex;gap:10px;padding:8px 12px;border-radius:5px;font-size:13px}
.ia-lista{display:flex;flex-direction:column;gap:10px;max-height:62vh;overflow-y:auto;padding:4px 2px 10px}
.ia-msg{max-width:min(760px,92%);padding:9px 12px;border-radius:10px;line-height:1.45;overflow-wrap:anywhere}
.ia-msg p{margin:0 0 6px}.ia-msg p:last-child{margin:0}
.ia-msg.eu{align-self:flex-end;background:var(--accent);color:#fff;white-space:pre-wrap}
.ia-msg.ia{align-self:flex-start;background:var(--panel2);border:1px solid var(--line)}
.ia-msg.erro{background:var(--bad-weak);color:var(--bad)}
.ia-msg table{border-collapse:collapse;margin:6px 0;font-size:13px}.ia-msg td,.ia-msg th{border:1px solid var(--line);padding:3px 7px;text-align:left}
.ia-sug{display:flex;flex-wrap:wrap;gap:6px}
.ia-form{display:flex;gap:8px;align-items:flex-end;border-top:1px solid var(--line);padding-top:10px}
.ia-form textarea{flex:1;min-width:0;resize:vertical;font:inherit;background:var(--panel);color:var(--ink);border:1px solid var(--line);border-radius:6px;padding:8px}
.alert.warn{background:var(--warn-weak);color:var(--warn)} .alert.bad{background:var(--bad-weak);color:var(--bad)} .alert.info{background:var(--accent-weak);color:var(--accent)}
/* gantt */
.gantt{position:relative}
.g-row{display:grid;grid-template-columns:270px 1fr;border-bottom:1px solid var(--line);min-height:26px;align-items:center}
.g-lab{padding:3px 8px;font:13px/1.25 var(--f-data);position:sticky;left:0;background:var(--panel);z-index:2;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;border-right:1px solid var(--line)}
.g-lab b{font-family:var(--f-mono);font-weight:500;font-size:12px;color:var(--muted);margin-right:6px}
.g-tr{position:relative;height:26px}
.g-b{position:absolute;top:7px;height:12px;border-radius:3px;background:var(--bar);overflow:hidden}
.g-b i{position:absolute;left:0;top:0;bottom:0;background:var(--bar-done)}
.g-b.crit{outline:2px solid var(--bad);outline-offset:0}
.g-head{display:grid;grid-template-columns:270px 1fr;position:sticky;top:0;z-index:3;background:var(--panel2);border-bottom:1px solid var(--line)}
.g-head .g-lab{background:var(--panel2);font:600 11.5px var(--f-ui);text-transform:uppercase;color:var(--muted)}
.g-m{position:absolute;top:0;bottom:0;border-left:1px solid var(--line);font:600 11px var(--f-ui);color:var(--muted);padding:6px 4px;white-space:nowrap}
.g-today{position:absolute;top:0;bottom:0;width:2px;background:var(--bad);z-index:1;opacity:.7}
/* gaveta */
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(760px,100%);background:var(--panel);border-left:1px solid var(--line);z-index:50;display:flex;flex-direction:column;box-shadow:-12px 0 40px rgba(0,0,0,.18)}
.drawer>header{padding:14px 16px;border-bottom:1px solid var(--line);display:flex;gap:12px;align-items:flex-start;padding-top:calc(14px + env(safe-area-inset-top,0px))}
.drawer>header h2{font-size:16px}
.drawer .in{padding:14px 16px;overflow:auto;flex:1;display:flex;flex-direction:column;gap:14px}
.shade{position:fixed;inset:0;background:rgba(10,15,18,.35);z-index:49}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(18px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:6px;z-index:60;font-weight:500;max-width:90vw}
.chart text{font:11px var(--f-data);fill:var(--muted)}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:12.5px;color:var(--muted)}
.legend i{display:inline-block;width:14px;height:3px;vertical-align:middle;margin-right:6px}
.sw{display:flex;border:1px solid var(--line);border-radius:5px;overflow:hidden}
.sw button{border:0;background:var(--panel);padding:5px 12px;cursor:pointer;font-weight:600;color:var(--muted)}
.sw button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
/* fotos */
.fotos-dia{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,220px),1fr));gap:12px}
.foto{margin:0;display:flex;flex-direction:column;gap:6px;min-width:0}
.foto button.ver{display:block;padding:0;border:1px solid var(--line);border-radius:5px;overflow:hidden;background:var(--panel2);cursor:zoom-in;aspect-ratio:4/3}
.foto button.ver img{width:100%;height:100%;object-fit:cover;display:block}
.foto button.ver:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.foto figcaption{font-size:13px;line-height:1.35}
.foto .falta{display:flex;align-items:center;justify-content:center;height:100%;font-size:12px;color:var(--muted)}
.lb{position:fixed;inset:0;z-index:70;background:rgba(8,12,14,.92);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:calc(12px + env(safe-area-inset-top,0px)) 16px calc(12px + env(safe-area-inset-bottom,0px))}
.lb img{max-width:100%;max-height:calc(100% - 70px);object-fit:contain;border-radius:4px}
.lb .cap{color:#E4EAEC;font-size:14px;margin-top:10px;text-align:center;max-width:900px}
.lb .nav{position:absolute;top:calc(12px + env(safe-area-inset-top,0px));right:16px;display:flex;gap:8px}
.lb .nav .btn{background:#1A2226;color:#E4EAEC;border-color:#2F3B41}
@media (max-width:900px){ .top{position:static} .kpis{grid-template-columns:repeat(2,minmax(0,1fr))} }
/* cronograma visual */
.cr-res{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px}
.cr-res button{text-align:left;border:1px solid var(--line);border-left-width:5px;border-radius:6px;background:var(--panel);padding:8px 10px;cursor:pointer;color:var(--ink)}
.cr-res button[aria-pressed="true"]{box-shadow:0 0 0 2px var(--accent)}
.cr-res .n{font:700 22px/1.1 var(--f-data)} .cr-res .t{font-size:12px;color:var(--muted)}
.cr-res .st-bad{border-left-color:var(--bad)} .cr-res .st-cur{border-left-color:var(--accent)} .cr-res .st-fut{border-left-color:var(--muted)} .cr-res .st-ok{border-left-color:var(--ok)} .cr-res .st-conc{border-left-color:#C9741A}
.cr-nav{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.cr-nav b{font-size:15px;margin-left:6px}
.cr-semana{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.cr-dia{border:1px solid var(--line);border-radius:6px;padding:6px;min-height:96px;background:var(--panel);min-width:0}
.cr-dia.hoje{border-color:var(--accent);box-shadow:inset 0 3px 0 var(--accent)}
.cr-dia.fds{background:var(--panel2)}
.cr-dn{font-size:12px;color:var(--muted);margin-bottom:4px}.cr-dn b{color:var(--ink);font-size:14px}
.cr-ev{font-size:12px;line-height:1.3;padding:2px 5px;border-radius:4px;margin-top:3px;overflow-wrap:anywhere}
.cr-ev.conc{background:#F6E2C8;color:#7A3F00;font-weight:700} .cr-ev.ini{background:var(--accent-weak);color:var(--accent)} .cr-ev.fim{background:var(--ok-weak);color:var(--ok)} .cr-ev.marco{background:var(--bad-weak);color:var(--bad);font-weight:700}
@media (prefers-color-scheme:dark){ :root:not([data-theme="light"]) .cr-ev.conc{background:#4A2E10;color:#F4C58E} }
:root[data-theme="dark"] .cr-ev.conc{background:#4A2E10;color:#F4C58E}
.cr-grupo{margin-top:16px}.cr-grupo h3{font-size:14px;margin:0 0 8px;display:flex;gap:8px;align-items:center}
.cr-cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,320px),1fr));gap:8px}
.cr-at{border:1px solid var(--line);border-left:5px solid var(--muted);border-radius:6px;padding:8px 10px;background:var(--panel);display:flex;flex-direction:column;gap:5px;min-width:0}
.cr-at.st-bad{border-left-color:var(--bad)} .cr-at.st-cur{border-left-color:var(--accent)} .cr-at.st-ok{border-left-color:var(--ok)}
.cr-at .nm{font-weight:600;line-height:1.3}
.cr-at .dt{font-size:12.5px;color:var(--muted)}
.cr-mini{display:grid;grid-template-columns:repeat(7,1fr);gap:2px}.cr-mini i{height:8px;border-radius:2px;background:var(--panel2)}
.cr-mini i.on{background:var(--bar)} .cr-mini i.conc{background:#C9741A}
.cr-cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.cr-cal .h{font-size:11px;font-weight:700;color:var(--muted);text-align:center;text-transform:uppercase}
.cr-cal button.d{border:1px solid var(--line);border-radius:5px;background:var(--panel);min-height:78px;padding:4px;text-align:left;cursor:pointer;color:var(--ink);display:flex;flex-direction:column;gap:2px;min-width:0;font:inherit}
.cr-cal button.d.fora{opacity:.4} .cr-cal button.d.hoje{border-color:var(--accent);box-shadow:inset 0 3px 0 var(--accent)} .cr-cal button.d[aria-pressed="true"]{outline:2px solid var(--accent)}
.cr-cal .dn{font-weight:700;font-size:13px}
.cr-cal .cr-ev{margin-top:0;font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cr-g{position:relative}
.cr-gl{display:grid;grid-template-columns:minmax(150px,32%) 1fr;align-items:center;border-bottom:1px solid var(--line);min-height:30px}
.cr-gl .cr-lb{padding:4px 8px;font:13px/1.25 var(--f-data);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cr-gl.et{background:var(--panel2);cursor:pointer}.cr-gl.et .cr-lb{font:700 13px var(--f-ui)}
.cr-tk{position:relative;height:30px}
.cr-tk .b{position:absolute;top:8px;height:14px;border-radius:3px;background:var(--muted);opacity:.85;overflow:hidden;min-width:3px}
.cr-tk .b.st-bad{background:var(--bad)} .cr-tk .b.st-cur{background:var(--accent)} .cr-tk .b.st-ok{background:var(--ok)} .cr-tk .b.st-fut{background:var(--bar)}
.cr-tk .b i{position:absolute;left:0;top:0;bottom:0;background:rgba(255,255,255,.35)}
.cr-tk .cc{position:absolute;top:9px;width:9px;height:9px;background:#C9741A;transform:translateX(-50%) rotate(45deg);border:1px solid var(--panel)}
.cr-tk .hj{position:absolute;top:0;bottom:0;width:2px;background:var(--bad);opacity:.8}
.cr-tk .m{position:absolute;top:0;bottom:0;border-left:1px dashed var(--line)}
.cr-gh{display:grid;grid-template-columns:minmax(150px,32%) 1fr;position:sticky;top:0;background:var(--panel2);z-index:2;border-bottom:1px solid var(--line)}
.cr-gh .cr-tk{height:24px}.cr-gh .ml{position:absolute;top:4px;font:600 11px var(--f-ui);color:var(--muted);transform:translateX(3px);white-space:nowrap}
.cr-leg{display:flex;flex-wrap:wrap;gap:12px;font-size:12px;color:var(--muted)}.cr-leg i{display:inline-block;width:14px;height:10px;border-radius:2px;margin-right:4px;vertical-align:middle}
.cr-marcos{display:flex;flex-wrap:wrap;gap:6px}
.cr-cal .pts{display:none;gap:2px;flex-wrap:wrap}.cr-cal .pts i{width:7px;height:7px;border-radius:50%;background:var(--accent)}.cr-cal .pts i.conc{background:#C9741A}
@media (max-width:640px){ .cr-semana{grid-template-columns:1fr} .cr-dia{min-height:0} .cr-cal button.d{min-height:56px} .cr-cal .cr-ev{display:none} .cr-cal .pts{display:flex} .cr-gl,.cr-gh{grid-template-columns:110px 1fr} }
@media (max-width:640px){ .kpi .v{font-size:16px} .g-row,.g-head{grid-template-columns:150px 1fr} td.desc{min-width:200px} }
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
</style>

function calc(){

  // orçamento
  for (const [eid, e] of Object.entries(S.orc)) {
    const et = m.etapas[e.n] || (m.etapas[e.n] = { eid, n:e.n, nome:e.nome, total:0, itens:[], real:0 });

  m.diretos = m.total - m.indiretos;

  const byId = {}; for (const a of ats) byId[a.id] = a;

function rsCel(m, n, sb){ const e = m.rs[n] || (m.rs[n] = {}); return e[sb] || (e[sb] = { oMO:0, oMAT:0, oSV:0, rMO:0, rMAT:0, rSV:0 }); }
// subetapa do orçamento com mais custo ligada à atividade (de preferência na mesma etapa)
function sbDominante(m, at, n){
  const t = m.atSb[at]; if (!t) return '';
  let best = '', bv = -1, bestAny = '', bvAny = -1;
  for (const [k, v] of Object.entries(t)) { const [en, sb] = [+k.split('|')[0], k.slice(k.indexOf('|') + 1)]; if (v > bvAny) { bvAny = v; bestAny = sb; } if (en === n && v > bv) { bv = v; best = sb; } }
  return best || bestAny;
}
// custo de cada atividade distribuído pelos dias corridos do seu período
function distribuir(ats, meses){
  const et = {}, tot = {}; for (const mm of meses) tot[mm] = 0;
  for (const a of ats) {
    if (!a.cost) continue; const n = etN(a.et); const row = et[n] || (et[n] = {});
    for (const mm of meses) {
      const s = a.ini > mm + '-01' ? a.ini : mm + '-01'; const ld = lastDay(mm); const e = a.fim < ld ? a.fim : ld;
      if (e >= s) { const v = a.cost * (diff(s, e) + 1) / a.dc; row[mm] = (row[mm] || 0) + v; tot[mm] += v; }
    }
  }
  return { et, tot };
}
function topo(byId){
  const indeg = {}, out = {}, res = [];
  for (const id in byId) { indeg[id] = 0; out[id] = []; }
  for (const id in byId) for (const p of String(byId[id].pred || '').split(';')) if (byId[p] && p !== id) { indeg[id]++; out[p].push(id); }
  const q = Object.keys(indeg).filter(id => !indeg[id]).sort((a, b) => (byId[a].ord || 0) - (byId[b].ord || 0));
  while (q.length) { const id = q.shift(); res.push(id); for (const s of out[id]) if (--indeg[s] === 0) q.push(s); }
  for (const id in byId) if (!res.includes(id)) res.push(id); // ciclo: mantém no fim
  return res;
}
// empurra as sucessoras quando uma atividade termina depois do início delas (nunca puxa para antes)
function propagar(patch){
  const A = {}; for (const [id, a] of Object.entries(S.at)) if (!a.x) A[id] = { ...a, ...(patch[id] || {}) };
  const ord = topo(A); const out = { ...patch }; let mov = 0;
  for (const id of ord) {
    const a = A[id]; if (a.iniR) continue;
    const ps = String(a.pred || '').split(';').filter(p => A[p]); if (!ps.length) continue;
    let min = null; for (const p of ps) { const f = addDays(A[p].fimR || A[p].fim, 1); if (!min || f > min) min = f; }
    if (a.ini < min) { a.ini = min; a.fim = addDays(min, Math.max(1, a.dur || 1) - 1); out[id] = { ...(out[id] || {}), ini:a.ini, fim:a.fim }; mov++; }
  }
  return { out, mov };
}

// ---------- gravação
async function upsert(path, data, base){
  const ref = db.doc(path);
  try { await ref.update(data); }
  catch (e) { if (e && e.code === 'invalid_argument') { const s = await ref.get(); if (!s.exists) { await ref.set(base ? merge(base, data) : data); return; } } throw e; }
}
function merge(a, b){ const o = { ...a }; for (const k in b) o[k] = (b[k] && typeof b[k] === 'object' && !Array.isArray(b[k]) && a[k] && typeof a[k] === 'object') ? merge(a[k], b[k]) : b[k]; return o; }
async function salvar(path, data, msg, base){
  if (!db) return false;
  if (!S.canEdit) { toast('Seu acesso é só de leitura. Peça acesso de edição à engenharia.'); return false; }
  try { await upsert(path, data, base); if (msg) registrar(msg); return true; }
  catch (e) { toast(e && e.code === 'quota_exceeded' ? 'A base da obra está cheia. Avise a engenharia.' : 'Não salvou: ' + (e && e.message || 'erro de conexão') + '. Tente de novo.'); return false; }
}
function registrar(msg){
  const mes = today().slice(0,7).replace('-','');
  upsert('hist/h' + mes, { l: { [uid('h')]: { t: new Date().toISOString(), u: S.uid || '', a: msg } } }, { mes }).catch(() => {});
}

function curvaS(){
  if (!M.meses.length) return '<div class="empty">Sem cronograma.</div>';
  const W = 760, H = 270, L = 64, Rr = 12, T = 12, B = 30, n = M.meses.length;
  let acc = 0; const prev = M.meses.map(mm => (acc += M.ffTot[mm]));
  let ar = 0; const hj = today().slice(0,7); const real = []; for (const mm of M.meses) { ar += M.realMes[mm] || 0; if (mm <= hj) real.push(ar); }
  const antes = Object.entries(M.realMes).filter(([mm]) => mm < M.meses[0]).reduce((s, [, v]) => s + v, 0); for (let i = 0; i < real.length; i++) real[i] += antes;
  const max = Math.max(M.total, prev[n-1] || 0, real[real.length-1] || 0) * 1.05 || 1;
  const x = i => L + (W - L - Rr) * (n === 1 ? 0.5 : i / (n - 1)), y = v => T + (H - T - B) * (1 - v / max);
  const ticks = 5; let g = '';
  for (let i = 0; i <= ticks; i++) { const v = max * i / ticks; g += `<line x1="${L}" x2="${W-Rr}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)" stroke-width="1"/><text x="${L-6}" y="${y(v)+4}" text-anchor="end">${(v/1e6).toLocaleString('pt-BR',{maximumFractionDigits:1})} mi</text>`; }
  M.meses.forEach((mm, i) => { if (n <= 14 || i % 2 === 0) g += `<text x="${x(i)}" y="${H-10}" text-anchor="middle">${mesLab(mm)}</text>`; });
  const pl = prev.map((v, i) => `${x(i)},${y(v)}`).join(' ');
  const area = `${x(0)},${y(0)} ${pl} ${x(n-1)},${y(0)}`;
  const rl = real.map((v, i) => `${x(i)},${y(v)}`).join(' ');
  const hi = M.meses.indexOf(hj); const fx = hi >= 0 ? x(hi) : null;
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Curva S: previsto acumulado ${R0(prev[n-1])}, realizado ${R0(real[real.length-1]||0)}">
    ${g}<polygon points="${area}" fill="var(--accent-weak)" stroke="none"/>
    <polyline points="${pl}" fill="none" stroke="var(--accent)" stroke-width="2.5"/>
    ${real.length ? `<polyline points="${rl}" fill="none" stroke="var(--warn)" stroke-width="2.5"/><circle cx="${x(real.length-1)}" cy="${y(real[real.length-1])}" r="4" fill="var(--warn)"/>` : ''}
    ${fx != null ? `<line x1="${fx}" x2="${fx}" y1="${T}" y2="${H-B}" stroke="var(--bad)" stroke-dasharray="3 3"/><circle cx="${fx}" cy="${y(M.fisRS)}" r="5" fill="var(--ok)"/>` : ''}
  </svg>`;
}

// orçado por pacote de contratação, com o custo por unidade de cada serviço (teto para negociar)
function pacotes(){
  const P = {};
  const pk = k => P[k] || (P[k] = { k, oMO:0, oMAT:0, oSV:0, r:0, rMO:0, lin:new Map() });
  const sbVal = {};
  for (const r of M.itens) {
    const p = pk(r.pc); p.oMO += r.mo; p.oMAT += r.mat; p.oSV += r.sv;
    const key = r.it.c + '|' + r.unid; let l = p.lin.get(key);
    if (!l) { l = { c:r.it.c, desc:r.desc, unid:r.unid, q:0, mo:0, mat:0, sv:0, trs:new Set(), sbs:new Set(), eid:r.eid, iid:r.iid }; p.lin.set(key, l); }
    l.q += r.it.q || 0; l.mo += r.mo; l.mat += r.mat; l.sv += r.sv; l.trs.add(r.tr); l.sbs.add(r.sb);
    const t = sbVal[r.sb] || (sbVal[r.sb] = {}); t[r.pc] = (t[r.pc] || 0) + r.tot;
  }
  // realizado: pela subetapa do lançamento
  for (const x of M.lanc) {
    let k = PAC_SB[x.sb];
    if (!k && sbVal[x.sb]) k = Object.entries(sbVal[x.sb]).sort((a, b) => b[1] - a[1])[0][0];
    const p = pk(k || 'outros'); p.r += x.l.v || 0; p.rMO += x.mo || 0;
  }
  return P;
}

  const tot = { oMO:0, oMAT:0, oSV:0, r:0 };

  for (const [g, gnome] of GRUPOS) {
    const ps = PACOTES.map(([k]) => P[k]).filter(p => p && PAC[p.k].g === g && (p.oMO + p.oMAT + p.oSV + p.r) > 0.5);
    if (!ps.length) continue;
    const gt = ps.reduce((a, p) => ({ oMO:a.oMO + p.oMO, oMAT:a.oMAT + p.oMAT, oSV:a.oSV + p.oSV, r:a.r + p.r }), { oMO:0, oMAT:0, oSV:0, r:0 });

function mdLeve(t){
  const ls = esc(t).split('\n'); let out = '', tab = [];
  const flush = () => { if (!tab.length) return; const rows = tab.filter(l => !/^\|?\s*:?-{2,}/.test(l.replace(/^\|\s*/, '|'))).map(l => l.replace(/^\||\|$/g, '').split('|').map(c => c.trim()));
    out += `<div class="scroll"><table>${rows.map((r, i) => `<tr>${r.map(c => i ? `<td>${c}</td>` : `<th>${c}</th>`).join('')}</tr>`).join('')}</table></div>`; tab = []; };
  for (const l of ls) { if (/^\s*\|/.test(l)) { tab.push(l.trim()); continue; } flush(); if (l.trim()) out += `<p>${l.replace(/^#{1,4}\s*(.+)$/, '<b>$1</b>').replace(/^\s*[-*]\s+/, '• ')}</p>`; }
  flush();
  return out.replace(/\*\*(.+?)\*\*/g, '<b>$1</b>');
}

  } else if (kind === 'cfg') {

    const ok = await salvar('obra/atividades', { at: out }, `Cronograma ${id}: ${campo(f)} ${fmtV(a[f])} → ${fmtV(p[f] ?? v)}${mov ? ` (${mov} sucessoras empurradas)` : ''}`);

  const el = ev.target;

  const map = { crTorre:'crTorre', crEt:'crEt', crSt:'crSt', lnTp:'lnTp', lnMes:'lnMes', oTorre:'oTorre', oEt:'oEt', oSub:'oSub', ffTorre:'ffTorre' };
  if (map[el.id]) { S[map[el.id]] = el.value; if (el.id === 'oEt') S.oSub = ''; render(); }
});
document.addEventListener('keydown', ev => {
  if (ev.key === 'Enter' && ev.target.matches('input.e')) { ev.preventDefault(); ev.target.blur(); }
  if (S.lb && ev.key === 'Escape') { S.lb = null; lightbox(); return; }
  if (S.lb && (ev.key === 'ArrowRight' || ev.key === 'ArrowLeft')) { const d = listaFotos().find(x => x.did === S.lb.did); if (d) { S.lb.i = (S.lb.i + (ev.key === 'ArrowRight' ? 1 : -1) + d.fs.length) % d.fs.length; lightbox(); } return; }
  if (ev.key === 'Escape' && S.drawer) { S.drawer = null; drawer(); }
});
let bt; document.addEventListener('input', ev => {
  if (ev.target.id === 'busca') { clearTimeout(bt); const v = ev.target.value; bt = setTimeout(() => { S.q = v; render(); }, 250); }
  if (ev.target.id === 'buscaIns') { clearTimeout(bt); const v = ev.target.value; bt = setTimeout(() => { S.insQ = v; render(); }, 250); }
});
document.addEventListener('submit', ev => { ev.preventDefault(); if (ev.target.hasAttribute('data-iaform')) perguntarIA(S.iaRascunho || ''); else if (ev.target.hasAttribute('data-novafoto')) enviarFotos(ev.target); else aoEnviar(ev.target); });
document.addEventListener('input', ev => { if (ev.target.id === 'ia-txt') S.iaRascunho = ev.target.value;
  if (ev.target.id === 'crQ') { clearTimeout(bt); const v = ev.target.value; bt = setTimeout(() => { S.crQ = v; render(); }, 300); } });
document.addEventListener('change', ev => { if (ev.target.id === 'crConc') { S.crConc = ev.target.checked; render(); } });
document.addEventListener('click', ev => {
  const b = ev.target.closest('[data-crmv],[data-crmes],[data-crdia],[data-crst],[data-act="cr-limpar"],[data-act="cg-abrir"],[data-act="cg-fechar"]'); if (!b) return;
  if (b.dataset.crst) { S.crSt = S.crSt === b.dataset.crst ? '' : b.dataset.crst; render(); return; }
  if (b.dataset.crdia) { S.crDia = S.crDia === b.dataset.crdia ? '' : b.dataset.crdia; render(); return; }
  if (b.dataset.crmes) { const r = (S.crRef || today()).slice(0, 7); let y = +r.slice(0, 4), m = +r.slice(5) + +b.dataset.crmes; if (m < 1) { m = 12; y--; } if (m > 12) { m = 1; y++; } S.crRef = y + '-' + pad(m) + '-01'; S.crDia = ''; render(); return; }
  if (b.dataset.crmv != null) { const v = b.dataset.crmv; if (!v) return; if (v === '0') S.crRef = ''; else if (/^\d{4}-/.test(v)) { S.crRef = v; if (S.crView === 'geral' || S.crView === 'tabela') S.crView = 'semana'; } else S.crRef = addDays(S.crRef || today(), +v); S.crDia = ''; render(); return; }
  if (b.dataset.act === 'cr-limpar') { S.crTorre = S.crEt = S.crSt = S.crQ = ''; S.crConc = false; render(); return; }
  if (b.dataset.act === 'cg-abrir') { for (const e of Object.values(M.etapas)) S.open['cg' + e.n] = true; render(); return; }
  if (b.dataset.act === 'cg-fechar') { for (const k in S.open) if (k.startsWith('cg')) delete S.open[k]; render(); return; }
});
document.addEventListener('keydown', ev => { if (ev.target.id === 'ia-txt' && ev.key === 'Enter' && !ev.shiftKey) { ev.preventDefault(); perguntarIA(ev.target.value); } });
document.addEventListener('click', ev => {
  const b = ev.target.closest('[data-iasug],[data-act="ia-limpar"]'); if (!b) return;
  if (b.dataset.iasug) perguntarIA(b.dataset.iasug); else { S.chat = []; S.iaRascunho = ''; render(); }
});

// ---------- início
async function boot(){
  renderTabs();
  db = await claude.use('db');
  if (!db) { S.noDb = true; render(); return; }
  user = await claude.use('user');
  if (user) { const can = await user.can('data.write'); S.canEdit = can == null ? await user.canEdit() : can; S.uid = await user.id(); }
  const err = e => { if (e && e.code === 'revoked') { S.noDb = true; render(); } };
  db.collection('obra').onSnapshot(s => { for (const d of s.docs) { const v = d.data(); if (d.id === 'config') S.cfg = v; else if (d.id === 'insumos') { S.ins = v.ins || {}; dlCache = ''; } else if (d.id === 'atividades') S.at = v.at || {}; } S.got.obra = true; later(); }, err);
  db.collection('comp').onSnapshot(s => { const c = {}, w = {}; for (const d of s.docs) for (const [k, v] of Object.entries((d.data() || {}).comps || {})) { c[k] = v; w[k] = d.id; } S.comps = c; S.compDoc = w; dlCache = ''; S.got.comp = true; later(); }, err);
  db.collection('orc').onSnapshot(s => { const o = {}; for (const d of s.docs) o[d.id] = d.data(); S.orc = o; S.got.orc = true; later(); }, err);
  db.collection('lanc').onSnapshot(s => { const o = {}; for (const d of s.docs) o[d.id] = d.data(); S.lanc = o; S.got.lanc = true; later(); }, err);
  db.collection('fotos').onSnapshot(s => { const o = {}; for (const d of s.docs) o[d.id] = d.data(); S.fotos = o; if (S.tab === 'fotos' || S.lb) later(); }, err);
  if (S.canEdit) claude.use('assets').then(a => { assetsNS = a; if (S.tab === 'fotos') later(); });
  db.collection('hist').onSnapshot(s => { const o = {}; for (const d of s.docs) o[d.id] = d.data(); S.hist = o; if (S.tab === 'historico') later(); }, err);
}
boot();
